<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="给自己用的本地记账本，数据只存在本机。">

<!-- 添加到主屏幕后按独立 App 运行 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小账本">
<link rel="icon" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<title>小账本</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">

  <!-- ===== 记账 ===== -->
  <main class="view is-active" id="view-add">
    <header class="head">
      <div class="head-row">
        <h1 class="page-title">记账</h1>
        <span class="head-chip" id="chipAdd">今天 ¥0</span>
      </div>
    </header>

    <section class="amount-box">
      <div class="seg" id="typeSeg">
        <span class="seg-thumb" id="segThumb"></span>
        <button class="seg-btn is-on" data-type="expense">支出</button>
        <button class="seg-btn" data-type="income">收入</button>
      </div>
      <div class="amount-line">
        <span class="cur">¥</span>
        <span class="amount" id="amountText">0</span>
        <span class="caret"></span>
      </div>
      <div class="meta-line">
        <button class="meta" id="metaDate"></button>
        <span class="dot">·</span>
        <button class="meta" id="metaNote">添加备注</button>
      </div>
      <div class="cat-scroll" id="catScroll"></div>
    </section>

    <section class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key key-fn" data-k="back">⌫</button>

      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key key-fn" data-k="date">日期</button>

      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key key-fn" data-k="note">备注</button>

      <button class="key" data-k="0">0</button>
      <button class="key" data-k="dot">.</button>
      <button class="key key-ok" data-k="save">完成</button>
    </section>
  </main>

  <!-- ===== 明细 ===== -->
  <main class="view" id="view-list">
    <header class="head">
      <div class="head-row">
        <h1 class="page-title">明细</h1>
        <div class="month-nav">
          <button class="arrow" data-month="-1">‹</button>
          <span class="month-text" id="listMonth">2026年10月</span>
          <button class="arrow" data-month="1">›</button>
        </div>
      </div>
    </header>
    <div class="scroll" id="listBody"></div>
  </main>

  <!-- ===== 图表 ===== -->
  <main class="view" id="view-chart">
    <header class="head">
      <div class="head-row">
        <h1 class="page-title">图表</h1>
        <div class="month-nav">
          <button class="arrow" data-month="-1">‹</button>
          <span class="month-text" id="chartMonth">2026年10月</span>
          <button class="arrow" data-month="1">›</button>
        </div>
      </div>
    </header>
    <div class="scroll" id="chartBody"></div>
  </main>

  <!-- ===== 家底 ===== -->
  <main class="view" id="view-wealth">
    <header class="head">
      <div class="head-row">
        <h1 class="page-title">家底</h1>
        <span class="head-chip" id="chipWealth">负债 —</span>
      </div>
    </header>
    <div class="scroll" id="wealthBody"></div>
  </main>

  <!-- ===== 我的 ===== -->
  <main class="view" id="view-me">
    <header class="head">
      <div class="head-row">
        <h1 class="page-title">我的</h1>
        <span class="head-chip" id="chipMe">— 笔</span>
      </div>
    </header>
    <div class="scroll" id="meBody"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-view="add">
      <span class="tab-ico">✎</span><span>记账</span>
    </button>
    <button class="tab" data-view="list">
      <span class="tab-ico">☰</span><span>明细</span>
    </button>
    <button class="tab" data-view="wealth">
      <span class="tab-ico">◈</span><span>家底</span>
    </button>
    <button class="tab" data-view="chart">
      <span class="tab-ico">◔</span><span>图表</span>
    </button>
    <button class="tab" data-view="me">
      <span class="tab-ico">☺</span><span>我的</span>
    </button>
  </nav>
</div>

<!-- 弹层 -->
<div class="mask" id="mask"></div>

<!-- 记录详情 / 编辑 -->
<div class="sheet" id="sheetRecord">
  <div class="sheet-head">
    <button class="sheet-cancel" data-close>取消</button>
    <h2>编辑记录</h2>
    <button class="sheet-save" id="editSave">保存</button>
  </div>
  <div class="sheet-body">
    <label class="field">
      <span class="field-label">金额</span>
      <input class="field-input" id="editAmount" type="text" inputmode="decimal">
    </label>
    <label class="field">
      <span class="field-label">日期</span>
      <input class="field-input" id="editDate" type="date">
    </label>
    <div class="field">
      <span class="field-label">分类</span>
      <div class="cat-scroll wrap" id="editCats"></div>
    </div>
    <label class="field">
      <span class="field-label">备注</span>
      <input class="field-input" id="editNote" type="text" placeholder="选填">
    </label>
    <button class="danger-btn" id="editDelete">删除这条记录</button>
  </div>
</div>

<!-- 选择器 -->
<div class="sheet sheet-sm" id="sheetPick">
  <div class="sheet-head">
    <button class="sheet-cancel" data-close>取消</button>
    <h2 id="pickTitle">选择</h2>
    <button class="sheet-save" id="pickOk">确定</button>
  </div>
  <div class="sheet-body">
    <div id="pickBody"></div>
  </div>
</div>

<!-- 导入 / 导出 -->
<div class="sheet" id="sheetData">
  <div class="sheet-head">
    <button class="sheet-cancel" data-close>关闭</button>
    <h2 id="dataTitle">数据</h2>
    <button class="sheet-save is-hidden" id="dataOk">确定</button>
  </div>
  <div class="sheet-body">
    <button class="add-btn" id="dataPickFile" style="margin-bottom:12px">📂 选择备份文件</button>
    <textarea class="editor" id="dataEditor" spellcheck="false"></textarea>
    <p class="hint" id="dataHint"></p>
  </div>
  <input type="file" id="dataFile" accept=".json,application/json" style="display:none">
</div>

<!-- 编辑债务 / 固定费用 -->
<div class="sheet" id="sheetItem">
  <div class="sheet-head">
    <button class="sheet-cancel" data-close>取消</button>
    <h2 id="itemTitle">编辑</h2>
    <button class="sheet-save" id="itemSave">保存</button>
  </div>
  <div class="sheet-body" id="itemBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
